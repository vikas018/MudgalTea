    <!--
      SPA fallback decoder (pairs with public/404.html). Converts the ?/-encoded path
      that 404.html produced back into a clean URL before the router boots.
    -->
    <script type="text/javascript">
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>
