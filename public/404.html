<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mudgal Tea</title>
    <!--
      GitHub Pages SPA fallback (spa-github-pages technique by Rafael Pedicini, MIT).
      GitHub Pages serves this file for any unknown path. It rewrites the path into a
      query string and redirects to index.html, which decodes it back into the URL so
      BrowserRouter can render the right route on a hard refresh or shared deep link.
      pathSegmentsToKeep = 1 keeps the '/MudgalTea' project-page base segment.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
